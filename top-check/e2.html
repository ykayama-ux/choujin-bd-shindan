<style>
html,body{margin:0;padding:0;font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
.cj-top{--navy:#1A1A2E;--white:#f6f5f1;--muted:#c2c7d1;--amber:#D4A574;background:var(--navy);color:var(--white);font-family:inherit;line-height:1.8}

#BD01{--position:50% 48%}#PR01{--position:50% 48%}#PR02{--position:50% 50%}#PR03{--position:50% 48%}#PR04{--position:50% 50%}#CM01{--position:50% 50%}#CM01 figcaption{right:calc(38.5% + 8px)}#CM02{--position:50% 48%}
